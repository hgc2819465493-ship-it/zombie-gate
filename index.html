<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>丧尸大作战</title>
<meta name="cache-bust" content="v2-ad-remake">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#1a3a5c;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d2840}
canvas{display:block;max-width:100%;max-height:100%;touch-action:none}
@media(min-width:500px){canvas{border-radius:12px;box-shadow:0 0 40px rgba(0,0,0,.4)}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(function(){
'use strict';

const W=390, H=780;
const SAVE_KEY='zs_ad_v2';
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let dpr=1;

function resize(){
  const vw=window.innerWidth, vh=window.innerHeight;
  const scale=Math.min(vw/W, vh/H);
  const cssW=Math.floor(W*scale), cssH=Math.floor(H*scale);
  dpr=Math.min(window.devicePixelRatio||1, 2.5);
  canvas.width=Math.floor(cssW*dpr);
  canvas.height=Math.floor(cssH*dpr);
  canvas.style.width=cssW+'px';
  canvas.style.height=cssH+'px';
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
}
window.addEventListener('resize',resize);
resize();

// ===== AUDIO =====
let AC=null;
function ensureAudio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state==='suspended') AC.resume();
}
function beep(freq,dur,type,vol,slide){
  if(!AC) return;
  try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.value=freq;
    if(slide) o.frequency.linearRampToValueAtTime(slide, AC.currentTime+dur);
    g.gain.value=vol||0.08;
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
function sfxShoot(){ beep(620+Math.random()*80,0.035,'sawtooth',0.025); }
function sfxHit(){ beep(180,0.05,'sawtooth',0.05,70); }
function sfxGate(){ beep(523,0.12,'triangle',0.1,784); }
function sfxBad(){ beep(160,0.2,'sawtooth',0.1,80); }
function sfxBoss(){ beep(100,0.35,'sawtooth',0.12,50); }
function sfxWin(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'triangle',0.1),i*100)); }
function sfxLose(){ beep(280,0.4,'sawtooth',0.1,70); }
function sfxCoin(){ beep(988,0.08,'sine',0.08,1319); }
function sfxUpgrade(){ beep(440,0.15,'triangle',0.1,880); }

// ===== SAVE =====
function loadSave(){
  try{
    const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');
    return {coins:s.coins|0, fireLv:s.fireLv|0, rateLv:s.rateLv|0, armyLv:s.armyLv|0, bestStage:s.bestStage|0};
  }catch(e){ return {coins:0,fireLv:0,rateLv:0,armyLv:0,bestStage:0}; }
}
function saveSave(s){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(s)); }catch(e){} }
let save=loadSave();
function upgradeCost(lv){ return 15 + lv*20 + lv*lv*8; }
function startPower(){ return 8 + save.armyLv*3; }
function fireDmg(){ return 1.2 + save.fireLv*0.7; }
function fireRate(){ return 0.10 - Math.min(save.rateLv,8)*0.008; }

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function rand(a,b){ return a+Math.random()*(b-a); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// ===== PERSPECTIVE ROAD =====
// depth z: 0 = near (bottom), 1 = far (horizon)
const HORIZON=0.18; // fraction of H
const ROAD_NEAR_L=28, ROAD_NEAR_R=W-28;
const ROAD_FAR_L=W*0.38, ROAD_FAR_R=W*0.62;

function roadXAt(z, lane01){
  // lane01: 0=left edge, 1=right edge of road
  const l=ROAD_NEAR_L+(ROAD_FAR_L-ROAD_NEAR_L)*z;
  const r=ROAD_NEAR_R+(ROAD_FAR_R-ROAD_NEAR_R)*z;
  return l + (r-l)*lane01;
}
function screenY(z){
  // z=0 near (bottom of screen), z=1 far (horizon near top)
  const eased = Math.pow(clamp(z,0,1), 0.9);
  return H - (H - HORIZON*H) * eased;
}
function scaleAt(z){
  return 0.18 + 0.82*(1-z);
}
// Convert world depth (meters ahead) + side to screen
// player sits at depth 0 visually near bottom
function worldToScreen(side, depth, scroll){
  // depth 0 = player plane, positive = ahead
  const maxD=80;
  const z = clamp(1 - (depth - scroll)/maxD, 0, 1);
  // remap: when depth-scroll is large, z near 0 (far)... wait
  // Better: depthAhead = depth - scroll; larger = farther = smaller z toward horizon
  const ahead = depth - scroll;
  const z2 = clamp(ahead / maxD, 0, 1); // 0=near, 1=far
  const y = screenY(z2);
  const x = roadXAt(z2, side);
  const sc = scaleAt(z2);
  return {x,y,z:z2,sc};
}

// ===== STATE =====
const state={
  screen:'menu',
  keys:{l:false,r:false},
  lane:0.72, // 0..1 across road (ad shows tank on right)
  power:5,
  truePower:5,
  scroll:0,
  speed:18,
  shootCD:0,
  stage:1,
  maxStage:5,
  stageLen:90,
  shake:0,
  particles:[],
  floats:[],
  beams:[], // purple energy beams
  zombies:[],
  gates:[],
  boss:null,
  coinsEarned:0,
  fireBoost:0,
  combo:0,
  comboT:0,
  flash:0,
  uiButtons:[],
  time:0,
  bossIntro:0,
  won:false,
  lost:false,
  events:[],
  nextEvent:0,
  checkeredAt:2
};

// ===== INPUT =====
const input={down:false, px:0};
function clientToGameX(cx){
  const r=canvas.getBoundingClientRect();
  return (cx-r.left)/r.width;
}
function clientToGameY(cy){
  const r=canvas.getBoundingClientRect();
  return (cy-r.top)/r.height;
}
canvas.addEventListener('pointerdown',e=>{
  ensureAudio();
  input.down=true; input.px=clientToGameX(e.clientX);
  canvas.setPointerCapture(e.pointerId);
  if(state.screen!=='play'){
    handleUIClick(clientToGameX(e.clientX)*W, clientToGameY(e.clientY)*H);
  }
});
canvas.addEventListener('pointermove',e=>{
  if(!input.down) return;
  const x=clientToGameX(e.clientX);
  const dx=x-input.px;
  input.px=x;
  if(state.screen==='play'){
    state.lane = clamp(state.lane + dx*1.6, 0.08, 0.92);
  }
});
canvas.addEventListener('pointerup',()=>{ input.down=false; });
canvas.addEventListener('pointercancel',()=>{ input.down=false; });

window.addEventListener('keydown',e=>{
  ensureAudio();
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') state.keys.l=true;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') state.keys.r=true;
  if(e.key===' '||e.key==='Enter'){
    if(state.screen==='menu') startGame();
    else if(state.screen==='upgrade') startStage();
    else if(state.screen==='win'||state.screen==='lose') state.screen='upgrade';
  }
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') state.keys.l=false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') state.keys.r=false;
});

function resetRun(){
  state.lane=0.72;
  state.truePower=startPower();
  state.power=state.truePower;
  state.scroll=0;
  state.speed=12+state.stage*1.2;
  state.shootCD=0;
  state.stageLen=95+state.stage*14;
  state.shake=0;
  state.particles=[];
  state.floats=[];
  state.beams=[];
  state.zombies=[];
  state.gates=[];
  state.boss=null;
  state.coinsEarned=0;
  state.fireBoost=0;
  state.combo=0;
  state.comboT=0;
  state.flash=0;
  state.won=false;
  state.lost=false;
  state.bossIntro=0;
  state.checkeredAt=1.5;
  buildStage();
}

function buildStage(){
  const s=state.stage;
  const events=[];
  let d=18;
  let wave=0;
  while(d < state.stageLen - 28){
    wave++;
    const goodOps=['+','+','+','×'];
    const badOps=['-','-','÷'];
    let leftOp,rightOp;
    if(Math.random()<0.55){ leftOp=pick(goodOps); rightOp=pick(badOps); }
    else { leftOp=pick(badOps); rightOp=pick(goodOps); }
    // Prefer putting a good gate on the right early (ad shows tank on right)
    if(wave===1){ leftOp=pick(badOps); rightOp=pick(goodOps); }
    events.push({
      type:'gates', depth:d,
      left:{op:leftOp,n:gateNum(leftOp,s,wave),charge:0,maxCharge:5},
      right:{op:rightOp,n:gateNum(rightOp,s,wave),charge:0,maxCharge:5}
    });
    d+=11+rand(2,4);

    // dense green pack like the ad
    const cols=5+Math.min(2,Math.floor(s/2));
    const rows=4+Math.min(5,wave);
    events.push({type:'zombies', depth:d, cols, rows, hp:1+Math.floor((s-1)/2)});
    d+=10+rand(2,4);

    if(wave%3===0){
      events.push({type:'zombies', depth:d, cols:6, rows:5+s, hp:1+Math.floor(s/2)});
      d+=9;
    }
  }
  events.push({
    type:'gates', depth:d,
    left:{op:'+',n:6+s*2,charge:0,maxCharge:4},
    right:{op:'×',n:2,charge:0,maxCharge:99}
  });
  d+=14;
  const bossHP=Math.floor(120+s*140+s*s*55);
  events.push({type:'boss', depth:d, hp:bossHP});
  state.events=events;
  state.nextEvent=0;
}

function gateNum(op,s,wave){
  if(op==='+') return Math.floor(2+s+wave*0.4+rand(0,3));
  if(op==='-') return Math.floor(2+s+wave*0.35+rand(0,3));
  if(op==='×') return pick([2,2,2,3]);
  if(op==='÷') return pick([2,2,3]);
  return 1;
}

function startGame(){ state.stage=1; state.screen='play'; resetRun(); sfxGate(); }
function startStage(){ state.screen='play'; resetRun(); }
function nextStage(){
  save.coins+=state.coinsEarned;
  if(state.stage>save.bestStage) save.bestStage=state.stage;
  saveSave(save);
  if(state.stage>=state.maxStage){ state.screen='win'; sfxWin(); }
  else { state.stage++; state.screen='upgrade'; sfxCoin(); }
}
function loseGame(){
  save.coins+=state.coinsEarned;
  saveSave(save);
  state.screen='lose';
  sfxLose();
}

function handleUIClick(x,y){
  for(const b of state.uiButtons){
    if(x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h){ b.fn(); return; }
  }
}

function applyGate(g){
  if(g.op==='+'){ state.truePower+=g.n; floatTxt(0.5,0.55,'+'+g.n,'#6cf'); sfxGate(); }
  else if(g.op==='-'){ state.truePower=Math.max(0,state.truePower-g.n); floatTxt(0.5,0.55,'-'+g.n,'#f44'); sfxBad(); state.shake=8; }
  else if(g.op==='×'){ state.truePower=Math.max(1,Math.floor(state.truePower*g.n)); floatTxt(0.5,0.55,'×'+g.n,'#4f8'); sfxGate(); state.flash=0.25; }
  else if(g.op==='÷'){ state.truePower=Math.max(0,Math.floor(state.truePower/g.n)); floatTxt(0.5,0.55,'÷'+g.n,'#f84'); sfxBad(); state.shake=10; }
  state.power=state.truePower;
  if(state.truePower<=0){ state.lost=true; setTimeout(loseGame,600); }
  for(let i=0;i<14;i++){
    state.particles.push({
      x:roadXAt(0.15,state.lane)+rand(-30,30), y:screenY(0.12)+rand(-10,10),
      vx:rand(-90,90), vy:rand(-140,-40), life:0.5, max:0.5,
      color:g.op==='-'||g.op==='÷'?'#f44':'#a0f', size:rand(3,8)
    });
  }
}

function chargeGate(g){
  if(g.op==='×'||g.op==='÷') return;
  g.charge=(g.charge||0)+1;
  if(g.charge>=(g.maxCharge||5)){
    g.charge=0;
    if(g.op==='+') g.n++;
    else if(g.op==='-'){ g.n--; if(g.n<=0){ g.op='+'; g.n=1; } }
  }
}

function spawnZombiePack(ev){
  const cols=ev.cols, rows=ev.rows;
  const packW=0.55;
  const startLane=(1-packW)/2;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const lane=startLane + (c/(cols-1||1))*packW + rand(-0.02,0.02);
      state.zombies.push({
        lane, depth:ev.depth + r*1.15 + rand(0,0.3),
        hp:ev.hp, maxHp:ev.hp,
        dead:false, wob:Math.random()*6,
        r:10+Math.min(ev.hp,3)*2
      });
    }
  }
}

function spawnBoss(ev){
  state.boss={
    lane:0.28, depth:ev.depth, hp:ev.hp, maxHp:ev.hp,
    phase:0, bob:0, hitFlash:0
  };
  state.bossIntro=1.4;
  sfxBoss();
  floatTxt(0.5,0.35,'BOSS 来袭!','#ff0');
}

function damagePower(n){
  state.truePower=Math.max(0,state.truePower-n);
  state.power=state.truePower;
  state.shake=6+n*2;
  state.flash=0.12;
  if(state.truePower<=0 && !state.lost){ state.lost=true; setTimeout(loseGame,700); }
}

function floatTxt(lane,z,text,color){
  const p=worldToScreen(lane, state.scroll + z*80, state.scroll);
  state.floats.push({x:p.x, y:p.y, text, color, life:0.9, vy:-55});
}

function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=rand(40,140);
    state.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(0.3,0.7),max:0.7,color,size:rand(2,6)});
  }
}

function update(dt){
  state.time+=dt;
  if(state.shake>0) state.shake=Math.max(0,state.shake-dt*40);
  if(state.flash>0) state.flash=Math.max(0,state.flash-dt);
  if(state.comboT>0){ state.comboT-=dt; if(state.comboT<=0) state.combo=0; }
  if(state.bossIntro>0) state.bossIntro-=dt;

  for(let i=state.particles.length-1;i>=0;i--){
    const p=state.particles[i];
    p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=180*dt;
    if(p.life<=0) state.particles.splice(i,1);
  }
  for(let i=state.floats.length-1;i>=0;i--){
    const f=state.floats[i];
    f.life-=dt; f.y+=f.vy*dt;
    if(f.life<=0) state.floats.splice(i,1);
  }

  if(state.screen!=='play' || state.won || state.lost) return;

  if(state.keys.l) state.lane-=1.1*dt;
  if(state.keys.r) state.lane+=1.1*dt;
  state.lane=clamp(state.lane,0.08,0.92);

  let spd=state.speed;
  if(state.boss && state.boss.phase>=1) spd*=0.2;
  if(state.bossIntro>0) spd*=0.25;
  state.scroll += spd*dt;

  // spawn events
  while(state.nextEvent < state.events.length){
    const ev=state.events[state.nextEvent];
    if(state.scroll + 55 < ev.depth) break;
    if(ev.type==='gates'){
      state.gates.push({
        depth:ev.depth,
        left:{...ev.left, used:false},
        right:{...ev.right, used:false},
        passed:false
      });
    } else if(ev.type==='zombies'){
      spawnZombiePack(ev);
    } else if(ev.type==='boss'){
      spawnBoss(ev);
    }
    state.nextEvent++;
  }

  // gates
  for(let i=state.gates.length-1;i>=0;i--){
    const g=state.gates[i];
    const ahead=g.depth-state.scroll;
    if(!g.passed && ahead < 1.2){
      g.passed=true;
      const side=state.lane<0.5 ? g.left : g.right;
      if(!side.used){ side.used=true; applyGate(side); }
      g.left.used=true; g.right.used=true;
    }
    if(ahead < -5) state.gates.splice(i,1);
  }

  // zombies approach (depth decreases relative = they march toward player)
  for(let i=state.zombies.length-1;i>=0;i--){
    const z=state.zombies[i];
    if(z.dead){ state.zombies.splice(i,1); continue; }
    z.depth -= (1.2+state.stage*0.25)*dt; // march toward player
    z.lane += Math.sin(state.time*3+z.wob)*0.015*dt;
    z.lane=clamp(z.lane,0.1,0.9);
    const ahead=z.depth-state.scroll;
    if(ahead < 0.8){
      damagePower(1);
      const p=worldToScreen(z.lane, z.depth, state.scroll);
      burst(p.x,p.y,'#3a3',8);
      state.zombies.splice(i,1);
      sfxHit();
    }
  }

  // boss
  if(state.boss){
    const b=state.boss;
    b.bob+=dt*3;
    if(b.hitFlash>0) b.hitFlash-=dt;
    const ahead=b.depth-state.scroll;
    if(b.phase===0){
      if(ahead < 18){ b.phase=1; }
    } else {
      b.lane = 0.28 + Math.sin(state.time*1.1)*0.06;
      // hold depth ~14 ahead
      const target=state.scroll+14;
      b.depth += (target-b.depth)*2*dt;
      if(state.time%2.8 < dt){
        for(let k=0;k<4;k++){
          state.zombies.push({
            lane:b.lane+rand(-0.15,0.15), depth:b.depth-1,
            hp:1+Math.floor(state.stage/2), maxHp:1+Math.floor(state.stage/2),
            dead:false, wob:rand(0,6), r:12
          });
        }
      }
    }
    if(b.hp<=0){
      state.boss=null;
      state.won=true;
      const bonus=25+state.stage*18+Math.floor(state.truePower*0.4);
      state.coinsEarned+=bonus;
      floatTxt(0.5,0.3,'通关! +'+bonus+'币','#ff0');
      const p=worldToScreen(0.3, state.scroll+14, state.scroll);
      burst(p.x,p.y,'#ff0',30); burst(p.x,p.y,'#f80',20);
      state.shake=16; sfxWin();
      setTimeout(nextStage,1600);
    }
  }

  // continuous purple beams (like the ad)
  const rate=Math.max(0.04, fireRate()*(1-state.fireBoost*0.4));
  state.shootCD-=dt;
  if(state.shootCD<=0 && state.power>0){
    state.shootCD=rate;
    // multiple parallel beams based on power
    const nBeams=Math.min(6, 2+Math.floor(Math.min(state.power,50)/8));
    for(let s=0;s<nBeams;s++){
      const spread=(s-(nBeams-1)/2)*0.035;
      state.beams.push({
        lane:state.lane+spread,
        depth:state.scroll+1.5,
        speed:55+save.fireLv*3,
        dmg:fireDmg(),
        life:1.2,
        w:11+Math.min(6,save.fireLv*0.5)
      });
    }
    sfxShoot();
  }

  // beams
  for(let i=state.beams.length-1;i>=0;i--){
    const b=state.beams[i];
    b.depth += b.speed*dt;
    b.life-=dt;
    let hit=false;
    const ahead=b.depth-state.scroll;

    // hit gates
    for(const g of state.gates){
      if(g.passed) continue;
      if(Math.abs(b.depth-g.depth)<1.2){
        const side=b.lane<0.5?g.left:g.right;
        if(!side.used){
          chargeGate(side);
          hit=true;
          const p=worldToScreen(b.lane,b.depth,state.scroll);
          state.particles.push({x:p.x,y:p.y,vx:rand(-40,40),vy:rand(-30,20),life:0.2,max:0.2,color:'#e0f',size:3});
        }
      }
    }

    // hit zombies
    if(!hit){
      for(let zi=0;zi<state.zombies.length;zi++){
        const z=state.zombies[zi];
        if(z.dead) continue;
        if(Math.abs(b.depth-z.depth)<1.3 && Math.abs(b.lane-z.lane)<0.07){
          z.hp-=b.dmg; hit=true;
          const p=worldToScreen(z.lane,z.depth,state.scroll);
          state.particles.push({x:p.x,y:p.y,vx:rand(-50,50),vy:rand(-40,20),life:0.25,max:0.25,color:'#6f6',size:3});
          if(z.hp<=0){
            z.dead=true;
            state.combo++; state.comboT=1.2;
            const coins=1+Math.floor(state.combo/5);
            state.coinsEarned+=coins;
            floatTxt(z.lane, clamp((z.depth-state.scroll)/80,0.05,0.8), '+'+coins, '#ff0');
            burst(p.x,p.y,'#3a3',6);
          }
          break;
        }
      }
    }

    // hit boss
    if(!hit && state.boss){
      const boss=state.boss;
      if(Math.abs(b.depth-boss.depth)<3 && Math.abs(b.lane-boss.lane)<0.18){
        boss.hp-=b.dmg;
        boss.hitFlash=0.1;
        hit=true;
        state.combo++; state.comboT=1.2;
        if(Math.random()<0.25){
          floatTxt(boss.lane, 0.25, '-'+Math.ceil(b.dmg), '#ff0');
        }
        const p=worldToScreen(b.lane,b.depth,state.scroll);
        state.particles.push({x:p.x,y:p.y,vx:rand(-40,40),vy:rand(-50,10),life:0.25,max:0.25,color:'#ff0',size:3});
      }
    }

    if(hit || b.life<=0 || ahead>70) state.beams.splice(i,1);
  }
}

// ===== DRAW HELPERS =====
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawMountains(){
  // sky
  const sky=ctx.createLinearGradient(0,0,0,H*0.55);
  sky.addColorStop(0,'#7ec8f0');
  sky.addColorStop(0.4,'#5aadde');
  sky.addColorStop(1,'#3a8fc4');
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  // distant mountains layers
  function mountainLayer(baseY, amp, color, seed){
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.moveTo(0,H);
    ctx.lineTo(0,baseY);
    for(let x=0;x<=W;x+=8){
      const n=Math.sin(x*0.01+seed)*amp + Math.sin(x*0.023+seed*1.7)*amp*0.5
            + Math.sin(x*0.047+seed*0.3)*amp*0.25;
      ctx.lineTo(x, baseY - n);
    }
    ctx.lineTo(W,H);
    ctx.closePath();
    ctx.fill();
  }
  mountainLayer(H*0.42, 55, '#2d6b8a', 1.2);
  mountainLayer(H*0.48, 40, '#3a7f9a', 3.5);
  mountainLayer(H*0.54, 28, '#4a91a8', 6.1);

  // haze near horizon
  const haze=ctx.createLinearGradient(0,H*0.15,0,H*0.45);
  haze.addColorStop(0,'rgba(180,220,240,0.15)');
  haze.addColorStop(1,'rgba(180,220,240,0)');
  ctx.fillStyle=haze;
  ctx.fillRect(0,0,W,H*0.5);
}

function drawBridge(){
  // road trapezoid
  ctx.beginPath();
  ctx.moveTo(ROAD_NEAR_L, H);
  ctx.lineTo(ROAD_NEAR_R, H);
  ctx.lineTo(ROAD_FAR_R, H*HORIZON);
  ctx.lineTo(ROAD_FAR_L, H*HORIZON);
  ctx.closePath();
  const rg=ctx.createLinearGradient(0,H*HORIZON,0,H);
  rg.addColorStop(0,'#6a7280');
  rg.addColorStop(0.3,'#5a6270');
  rg.addColorStop(1,'#4a5260');
  ctx.fillStyle=rg;
  ctx.fill();

  // yellow edge lines
  ctx.strokeStyle='#e8c84a';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(ROAD_NEAR_L+4,H); ctx.lineTo(ROAD_FAR_L+2,H*HORIZON); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ROAD_NEAR_R-4,H); ctx.lineTo(ROAD_FAR_R-2,H*HORIZON); ctx.stroke();

  // white edge
  ctx.strokeStyle='rgba(255,255,255,0.7)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(ROAD_NEAR_L+10,H); ctx.lineTo(ROAD_FAR_L+4,H*HORIZON); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ROAD_NEAR_R-10,H); ctx.lineTo(ROAD_FAR_R-4,H*HORIZON); ctx.stroke();

  // lane dashes (perspective)
  const scrollOff=(state.scroll*8)%1;
  for(let i=-1;i<18;i++){
    const z0=clamp((i+scrollOff)/16, 0, 0.98);
    const z1=clamp((i+0.35+scrollOff)/16, 0, 0.98);
    if(z0>=0.95) continue;
    const x0=roadXAt(z0,0.5), y0=screenY(z0);
    const x1=roadXAt(z1,0.5), y1=screenY(z1);
    const sc=scaleAt(z0);
    ctx.strokeStyle='rgba(255,255,255,0.55)';
    ctx.lineWidth=Math.max(1,4*sc);
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  }

  // checkered band near player (like ad)
  const cz=0.08;
  const cy=screenY(cz);
  const cl=roadXAt(cz,0), cr=roadXAt(cz,1);
  const ch=18*scaleAt(cz);
  const cells=10;
  const cw=(cr-cl)/cells;
  for(let i=0;i<cells;i++){
    ctx.fillStyle=(i%2===0)?'#1a1a1a':'#e8e8e8';
    ctx.fillRect(cl+i*cw, cy-ch*0.3, cw+0.5, ch);
  }
  for(let i=0;i<cells;i++){
    ctx.fillStyle=(i%2===1)?'#1a1a1a':'#e8e8e8';
    ctx.fillRect(cl+i*cw, cy-ch*0.3+ch*0.5, cw+0.5, ch*0.5);
  }

  // bridge railings / concrete barriers
  ctx.fillStyle='#8a9098';
  // left barrier
  ctx.beginPath();
  ctx.moveTo(ROAD_NEAR_L-18,H);
  ctx.lineTo(ROAD_NEAR_L,H);
  ctx.lineTo(ROAD_FAR_L, H*HORIZON);
  ctx.lineTo(ROAD_FAR_L-6, H*HORIZON);
  ctx.closePath();
  ctx.fill();
  // right barrier
  ctx.beginPath();
  ctx.moveTo(ROAD_NEAR_R,H);
  ctx.lineTo(ROAD_NEAR_R+18,H);
  ctx.lineTo(ROAD_FAR_R+6, H*HORIZON);
  ctx.lineTo(ROAD_FAR_R, H*HORIZON);
  ctx.closePath();
  ctx.fill();

  // railing posts
  for(let i=0;i<12;i++){
    const z=i/12;
    const sc=scaleAt(z);
    const y=screenY(z);
    const lx=roadXAt(z,0)-8*sc;
    const rx=roadXAt(z,1)+8*sc;
    ctx.fillStyle='#6a7078';
    ctx.fillRect(lx-2*sc, y-18*sc, 4*sc, 18*sc);
    ctx.fillRect(rx-2*sc, y-18*sc, 4*sc, 18*sc);
  }

  // side abutments / drop below bridge
  ctx.fillStyle='#3a5a4a';
  ctx.fillRect(0, H*0.55, ROAD_NEAR_L-18, H*0.45);
  ctx.fillRect(ROAD_NEAR_R+18, H*0.55, W-(ROAD_NEAR_R+18), H*0.45);
}

function drawTank(lane, depth){
  const p=worldToScreen(lane, depth, state.scroll);
  // force near plane for player
  const x=roadXAt(0.05, lane);
  const y=screenY(0.05);
  const sc=1.05;

  ctx.save();
  ctx.translate(x,y);

  // shadow
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(0,12*sc,28*sc,8*sc,0,0,Math.PI*2); ctx.fill();

  // tracks
  ctx.fillStyle='#152238';
  roundRect(-30*sc,-8*sc,14*sc,28*sc,4); ctx.fill();
  roundRect(16*sc,-8*sc,14*sc,28*sc,4); ctx.fill();
  // 4 clear wheels
  const wheels=[[-23,-2],[-23,12],[23,-2],[23,12]];
  for(const [wx,wy] of wheels){
    ctx.fillStyle='#0a1020';
    ctx.beginPath(); ctx.arc(wx*sc, wy*sc, 6*sc, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle='#6ab0ff'; ctx.lineWidth=2*sc;
    ctx.beginPath(); ctx.arc(wx*sc, wy*sc, 6*sc, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle='#3a6ad4';
    ctx.beginPath(); ctx.arc(wx*sc, wy*sc, 2.2*sc, 0, Math.PI*2); ctx.fill();
  }

  // hull (metallic blue)
  const hull=ctx.createLinearGradient(-22*sc,-10*sc,22*sc,16*sc);
  hull.addColorStop(0,'#5aa0ff');
  hull.addColorStop(0.4,'#2a6ad4');
  hull.addColorStop(1,'#1a4a9a');
  ctx.fillStyle=hull;
  roundRect(-24*sc,-10*sc,48*sc,22*sc,6);
  ctx.fill();
  ctx.strokeStyle='rgba(180,220,255,0.6)';
  ctx.lineWidth=1.5;
  roundRect(-22*sc,-8*sc,44*sc,20*sc,5);
  ctx.stroke();

  // turret
  const tur=ctx.createLinearGradient(-14*sc,-22*sc,14*sc,-4*sc);
  tur.addColorStop(0,'#6ab0ff');
  tur.addColorStop(1,'#2a5ab0');
  ctx.fillStyle=tur;
  roundRect(-14*sc,-20*sc,28*sc,14*sc,4);
  ctx.fill();

  // cannon barrel pointing up (forward)
  ctx.fillStyle='#1a3a7a';
  roundRect(-4*sc,-38*sc,8*sc,22*sc,2);
  ctx.fill();
  ctx.fillStyle='#4a8aef';
  roundRect(-3*sc,-40*sc,6*sc,4*sc,1);
  ctx.fill();

  // canopy / glass
  ctx.fillStyle='rgba(120,200,255,0.5)';
  roundRect(-8*sc,-18*sc,16*sc,8*sc,2);
  ctx.fill();

  // power badge
  ctx.font='bold '+Math.floor(16*sc)+'px sans-serif';
  ctx.textAlign='center';
  ctx.lineWidth=3;
  ctx.strokeStyle='#0a2040';
  ctx.fillStyle='#fff';
  ctx.strokeText(String(Math.floor(state.truePower)), 0, 28*sc);
  ctx.fillText(String(Math.floor(state.truePower)), 0, 28*sc);

  ctx.restore();
}

function drawBeam(b){
  const ahead=b.depth-state.scroll;
  if(ahead<0 || ahead>65) return;
  // Ad-style: thick vertical PURPLE energy rectangles
  const zNear=clamp((ahead-1.5)/80, 0, 0.95);
  const zFar=clamp((ahead+8)/80, 0, 0.95);
  const x0=roadXAt(zNear, b.lane), y0=screenY(zNear);
  const x1=roadXAt(zFar, b.lane), y1=screenY(zFar);
  const sc0=scaleAt(zNear);
  const w0=b.w*sc0;

  // soft outer bloom
  ctx.strokeStyle='rgba(160,60,255,0.28)';
  ctx.lineWidth=w0*3.2;
  ctx.lineCap='butt';
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();

  // solid purple slab (looks like glowing rectangle)
  ctx.strokeStyle='#b44fff';
  ctx.lineWidth=w0*1.35;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();

  // brighter inner
  ctx.strokeStyle='#d080ff';
  ctx.lineWidth=w0*0.85;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();

  // hot white core
  ctx.strokeStyle='rgba(255,235,255,0.95)';
  ctx.lineWidth=Math.max(2, w0*0.28);
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
}

function drawGate(g){
  const ahead=g.depth-state.scroll;
  if(ahead<0 || ahead>70) return;
  const z=clamp(ahead/80, 0.02, 0.95);
  const y=screenY(z);
  const sc=scaleAt(z);
  const mid=0.5;
  const leftX=roadXAt(z,0.02);
  const rightX=roadXAt(z,0.98);
  const midX=roadXAt(z,mid);
  const h=48*sc;
  const gap=4*sc;

  drawOneGate(leftX, midX-gap, y, h, sc, g.left, true);
  drawOneGate(midX+gap, rightX, y, h, sc, g.right, false);
}

function drawOneGate(x0,x1,y,h,sc,gate,isLeft){
  const w=x1-x0;
  const good=gate.op==='+'||gate.op==='×';
  // Ad shows PURPLE glowing gate - use purple for good, red for bad
  const col1=good?'#c060ff':'#e83838';
  const col2=good?'#e8a0ff':'#ff8080';
  const glow=good?'#a040ff':'#ff4040';

  ctx.save();
  // glow
  ctx.shadowColor=glow;
  ctx.shadowBlur=18*sc;

  // frame
  const grd=ctx.createLinearGradient(x0,y-h,x0,y);
  grd.addColorStop(0,col2);
  grd.addColorStop(0.5,col1);
  grd.addColorStop(1,col2);
  ctx.fillStyle=grd;
  roundRect(x0, y-h, w, h, 6*sc);
  ctx.fill();

  // inner energy swirl (yellow/purple like ad)
  if(good && !gate.used){
    ctx.shadowBlur=10*sc;
    ctx.fillStyle='rgba(255,220,80,0.45)';
    roundRect(x0+6*sc, y-h+6*sc, w-12*sc, h-12*sc, 4*sc);
    ctx.fill();
    // swirl arcs
    ctx.strokeStyle='rgba(255,240,120,0.7)';
    ctx.lineWidth=2*sc;
    ctx.beginPath();
    ctx.arc(x0+w/2, y-h/2, 10*sc, state.time*4, state.time*4+2);
    ctx.stroke();
  }

  ctx.shadowBlur=0;

  // border
  ctx.strokeStyle='rgba(255,255,255,0.55)';
  ctx.lineWidth=2*sc;
  roundRect(x0+2*sc, y-h+2*sc, w-4*sc, h-4*sc, 4*sc);
  ctx.stroke();

  // label
  ctx.font='bold '+Math.floor(26*sc)+'px sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  const label=gate.op+gate.n;
  ctx.strokeStyle='rgba(0,0,0,0.55)';
  ctx.lineWidth=4*sc;
  ctx.strokeText(label, x0+w/2, y-h/2);
  ctx.fillStyle='#fff';
  ctx.fillText(label, x0+w/2, y-h/2);

  // charge bar
  if((gate.op==='+'||gate.op==='-') && !gate.used){
    const pct=(gate.charge||0)/(gate.maxCharge||5);
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.fillRect(x0+8*sc, y-8*sc, w-16*sc, 4*sc);
    ctx.fillStyle='#fff';
    ctx.fillRect(x0+8*sc, y-8*sc, (w-16*sc)*pct, 4*sc);
  }

  if(gate.used){
    ctx.fillStyle='rgba(0,0,0,0.5)';
    roundRect(x0, y-h, w, h, 6*sc);
    ctx.fill();
  }
  ctx.restore();
}

function drawZombie(z){
  const ahead=z.depth-state.scroll;
  if(ahead<0 || ahead>70) return;
  const p=worldToScreen(z.lane, z.depth, state.scroll);
  const sc=p.sc;
  const r=z.r*sc;

  ctx.save();
  ctx.translate(p.x, p.y);
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(0,r*0.55,r*0.85,r*0.3,0,0,Math.PI*2); ctx.fill();

  // dense circular green blob (like the ad)
  const grd=ctx.createRadialGradient(-r*0.25,-r*0.25,r*0.1,0,0,r);
  grd.addColorStop(0,'#7dff6a');
  grd.addColorStop(0.55,'#3cc830');
  grd.addColorStop(1,'#1a7a18');
  ctx.fillStyle=grd;
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();

  // highlight
  ctx.fillStyle='rgba(200,255,180,0.45)';
  ctx.beginPath(); ctx.arc(-r*0.3,-r*0.3,r*0.35,0,Math.PI*2); ctx.fill();

  // outline
  ctx.strokeStyle='rgba(0,60,0,0.45)';
  ctx.lineWidth=Math.max(1,1.5*sc);
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();

  // tiny eyes
  if(sc>0.35){
    ctx.fillStyle='#1a3010';
    ctx.beginPath(); ctx.arc(-r*0.25,-r*0.1,r*0.15,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.25,-r*0.1,r*0.15,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#f44';
    ctx.beginPath(); ctx.arc(-r*0.25,-r*0.1,r*0.07,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.25,-r*0.1,r*0.07,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawBoss(b){
  const ahead=b.depth-state.scroll;
  if(ahead<0 || ahead>75) return;
  const p=worldToScreen(b.lane, b.depth, state.scroll);
  // make boss large
  const sc=Math.max(0.55, p.sc*1.8);
  const x=p.x, y=p.y;

  ctx.save();
  ctx.translate(x, y + Math.sin(b.bob)*3*sc);

  // golden glow
  ctx.shadowColor='#ffd700';
  ctx.shadowBlur=b.hitFlash>0 ? 40 : 22;

  const body=b.hitFlash>0 ? '#fff8d0' : '#e8b820';
  const armor=b.hitFlash>0 ? '#fff' : '#f0c040';
  const dark=b.hitFlash>0 ? '#eee' : '#c09010';

  // legs
  ctx.fillStyle=body;
  roundRect(-22*sc, 28*sc, 16*sc, 36*sc, 3*sc); ctx.fill();
  roundRect(6*sc, 28*sc, 16*sc, 36*sc, 3*sc); ctx.fill();
  // boots
  ctx.fillStyle=dark;
  roundRect(-24*sc, 58*sc, 20*sc, 10*sc, 2*sc); ctx.fill();
  roundRect(4*sc, 58*sc, 20*sc, 10*sc, 2*sc); ctx.fill();

  // torso (tactical vest)
  ctx.fillStyle=body;
  roundRect(-32*sc, -18*sc, 64*sc, 52*sc, 8*sc); ctx.fill();
  // armor plates
  ctx.fillStyle=armor;
  roundRect(-26*sc, -8*sc, 52*sc, 16*sc, 3*sc); ctx.fill();
  roundRect(-22*sc, 12*sc, 20*sc, 14*sc, 2*sc); ctx.fill();
  roundRect(2*sc, 12*sc, 20*sc, 14*sc, 2*sc); ctx.fill();

  // arms
  ctx.fillStyle=body;
  roundRect(-44*sc, -10*sc, 14*sc, 36*sc, 4*sc); ctx.fill();
  roundRect(30*sc, -6*sc, 14*sc, 32*sc, 4*sc); ctx.fill();

  // LARGE rifle across chest (like ad)
  ctx.shadowBlur=0;
  ctx.fillStyle='#2a2a2a';
  ctx.save();
  ctx.translate(4*sc, 4*sc);
  ctx.rotate(-0.35);
  roundRect(-8*sc, -6*sc, 70*sc, 12*sc, 2*sc); ctx.fill();
  // barrel
  ctx.fillStyle='#1a1a1a';
  roundRect(55*sc, -4*sc, 28*sc, 7*sc, 1*sc); ctx.fill();
  // scope
  ctx.fillStyle='#444';
  roundRect(20*sc, -12*sc, 14*sc, 6*sc, 1*sc); ctx.fill();
  // stock
  ctx.fillStyle='#333';
  roundRect(-18*sc, -5*sc, 14*sc, 10*sc, 2*sc); ctx.fill();
  ctx.restore();

  // head + helmet with visor
  ctx.shadowColor='#ffd700';
  ctx.shadowBlur=b.hitFlash>0 ? 30 : 14;
  ctx.fillStyle=body;
  ctx.beginPath(); ctx.arc(0, -36*sc, 22*sc, 0, Math.PI*2); ctx.fill();
  // helmet
  ctx.fillStyle=dark;
  ctx.beginPath(); ctx.arc(0, -40*sc, 22*sc, Math.PI, 0); ctx.fill();
  ctx.fillRect(-22*sc, -42*sc, 44*sc, 10*sc);
  // visor
  ctx.shadowBlur=0;
  ctx.fillStyle='#1a3050';
  roundRect(-16*sc, -40*sc, 32*sc, 10*sc, 3*sc); ctx.fill();
  ctx.fillStyle='rgba(100,180,255,0.5)';
  roundRect(-14*sc, -38*sc, 28*sc, 6*sc, 2*sc); ctx.fill();

  ctx.restore();

  // BIG HP number in front of torso (like "1709" in ad)
  const hp=Math.max(0, Math.ceil(b.hp));
  ctx.font='bold '+Math.floor(42*sc)+'px sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.lineWidth=6*sc;
  ctx.strokeStyle='#000';
  ctx.fillStyle='#fff';
  ctx.strokeText(String(hp), x, y+4*sc);
  ctx.fillText(String(hp), x, y+4*sc);

  // thin HP bar above
  const bw=90*sc, bh=7*sc;
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.fillRect(x-bw/2, y-70*sc, bw, bh);
  ctx.fillStyle='#f44';
  ctx.fillRect(x-bw/2, y-70*sc, bw*(b.hp/b.maxHp), bh);
  ctx.strokeStyle='#ffd700';
  ctx.lineWidth=1;
  ctx.strokeRect(x-bw/2, y-70*sc, bw, bh);
}

function drawWorld(){
  // sort draw by depth (far first)
  const items=[];
  for(const g of state.gates) items.push({t:'gate', depth:g.depth, g});
  for(const z of state.zombies) if(!z.dead) items.push({t:'zom', depth:z.depth, z});
  if(state.boss) items.push({t:'boss', depth:state.boss.depth, b:state.boss});
  for(const b of state.beams) items.push({t:'beam', depth:b.depth, b});
  items.sort((a,b)=>b.depth-a.depth);

  for(const it of items){
    if(it.t==='gate') drawGate(it.g);
    else if(it.t==='zom') drawZombie(it.z);
    else if(it.t==='boss') drawBoss(it.b);
    else if(it.t==='beam') drawBeam(it.b);
  }

  // player tank always on top near
  drawTank(state.lane, state.scroll);

  // particles
  for(const p of state.particles){
    ctx.globalAlpha=Math.max(0,p.life/(p.max||0.5));
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  for(const f of state.floats){
    ctx.globalAlpha=Math.max(0,f.life);
    ctx.font='bold 22px sans-serif';
    ctx.textAlign='center';
    ctx.fillStyle=f.color;
    ctx.strokeStyle='#000';
    ctx.lineWidth=3;
    ctx.strokeText(f.text,f.x,f.y);
    ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1;
}

function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.fillRect(0,0,W,48);

  ctx.font='bold 15px sans-serif';
  ctx.textAlign='left';
  ctx.fillStyle='#fff';
  ctx.fillText('关卡 '+state.stage+'/'+state.maxStage, 12, 28);

  ctx.textAlign='right';
  ctx.fillStyle='#ffd700';
  ctx.fillText('币 +'+state.coinsEarned, W-12, 28);

  const pct=clamp(state.scroll/state.stageLen,0,1);
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.fillRect(70,38,W-140,5);
  ctx.fillStyle='#c060ff';
  ctx.fillRect(70,38,(W-140)*pct,5);

  if(state.combo>=3){
    ctx.textAlign='center';
    ctx.fillStyle='#e8a0ff';
    ctx.font='bold 17px sans-serif';
    ctx.fillText('连击 ×'+state.combo, W/2, 68);
  }

  if(state.bossIntro>0){
    ctx.fillStyle='rgba(0,0,0,0.55)';
    ctx.fillRect(0,H*0.38,W,52);
    ctx.fillStyle='#ffd700';
    ctx.font='bold 26px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('⚠ 金色首领来袭 ⚠', W/2, H*0.38+34);
  }

  if(state.time<4 && state.stage===1){
    ctx.globalAlpha=0.85;
    ctx.fillStyle='#fff';
    ctx.font='14px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('← 左右滑动选门 →　紫光自动射击', W/2, H-28);
    ctx.globalAlpha=1;
  }
}

function drawButton(x,y,w,h,label,color,fn){
  ctx.fillStyle=color;
  roundRect(x,y,w,h,12); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.35)';
  ctx.lineWidth=2;
  roundRect(x+2,y+2,w-4,h-4,10); ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.font='bold 20px sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(label, x+w/2, y+h/2+1);
  state.uiButtons.push({x,y,w,h,fn});
}

function drawMenu(){
  state.uiButtons=[];
  // decorative title like ad overlay
  ctx.textAlign='center';
  ctx.font='bold 40px sans-serif';
  ctx.lineWidth=7;
  ctx.strokeStyle='#000';
  ctx.fillStyle='#fff';
  ctx.strokeText('丧尸大作战', W/2, 150);
  ctx.fillText('丧尸大作战', W/2, 150);

  ctx.font='bold 16px sans-serif';
  ctx.fillStyle='#e8a0ff';
  ctx.fillText('紫光坦克 · 过门加成 · 金装首领', W/2, 190);

  // mini preview tank
  ctx.save();
  ctx.translate(W/2, 280);
  ctx.scale(1.3,1.3);
  // fake tank at origin
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(0,12,28,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2a6ad4';
  roundRect(-22,-8,44,20,5); ctx.fill();
  ctx.fillStyle='#5aa0ff';
  roundRect(-14,-20,28,14,4); ctx.fill();
  ctx.fillStyle='#1a3a7a';
  roundRect(-4,-38,8,22,2); ctx.fill();
  // purple beams preview
  for(let i=0;i<3;i++){
    const bx=(i-1)*14;
    ctx.strokeStyle='rgba(192,96,255,0.8)';
    ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(bx,-40); ctx.lineTo(bx,-110); ctx.stroke();
  }
  ctx.restore();

  // green blobs preview
  for(let i=0;i<7;i++){
    for(let j=0;j<2;j++){
      const gx=W/2-60+i*20, gy=360+j*18;
      ctx.fillStyle='#3cc830';
      ctx.beginPath(); ctx.arc(gx,gy,9,0,Math.PI*2); ctx.fill();
    }
  }

  drawButton(W/2-110, 430, 220, 56, '开始游戏', '#8a2be2', ()=>startGame());

  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.font='13px sans-serif';
  ctx.textAlign='center';
  ctx.fillText('滑动左右选门 · 射击自动 · 打爆首领', W/2, 520);
  ctx.fillStyle='#ffd700';
  ctx.fillText('已有币: '+save.coins+'　最高关: '+Math.max(1,save.bestStage), W/2, 548);
}

function drawUpgrade(){
  state.uiButtons=[];
  ctx.fillStyle='rgba(10,20,40,0.78)';
  ctx.fillRect(0,0,W,H);

  ctx.textAlign='center';
  ctx.fillStyle='#c060ff';
  ctx.font='bold 30px sans-serif';
  ctx.fillText('关卡 '+state.stage+' 准备', W/2, 78);
  ctx.fillStyle='#ffd700';
  ctx.font='18px sans-serif';
  ctx.fillText('金币: '+save.coins, W/2, 115);

  const items=[
    {name:'初始火力值', key:'armyLv', desc:'开局更强'},
    {name:'紫光伤害', key:'fireLv', desc:'激光更疼'},
    {name:'射速', key:'rateLv', desc:'射得更快'}
  ];
  items.forEach((it,i)=>{
    const y=155+i*95;
    const lv=save[it.key];
    const cost=upgradeCost(lv);
    ctx.fillStyle='rgba(40,20,70,0.9)';
    roundRect(24,y,W-48,82,12); ctx.fill();
    ctx.strokeStyle='#c060ff'; ctx.lineWidth=2;
    roundRect(24,y,W-48,82,12); ctx.stroke();
    ctx.textAlign='left';
    ctx.fillStyle='#fff';
    ctx.font='bold 18px sans-serif';
    ctx.fillText(it.name+' Lv.'+lv, 42, y+32);
    ctx.font='13px sans-serif';
    ctx.fillStyle='#c8a0e8';
    ctx.fillText(it.desc, 42, y+56);
    const can=save.coins>=cost;
    drawButton(W-148, y+18, 100, 44, can?cost+'币':'不够', can?'#6a2':'#555', ()=>{
      if(save.coins>=cost){ save.coins-=cost; save[it.key]++; saveSave(save); sfxUpgrade(); }
      else sfxBad();
    });
  });

  drawButton(W/2-110, 470, 220, 56, '进入关卡 '+state.stage, '#e8a020', ()=>startStage());
}

function drawEnd(win){
  state.uiButtons=[];
  ctx.fillStyle='rgba(0,0,0,0.65)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='bold 42px sans-serif';
  ctx.lineWidth=6; ctx.strokeStyle='#000';
  if(win){
    ctx.fillStyle='#ffd700';
    ctx.strokeText('胜利!', W/2, 200); ctx.fillText('胜利!', W/2, 200);
    ctx.font='17px sans-serif'; ctx.fillStyle='#fff';
    ctx.fillText('金色首领已被紫光打爆！', W/2, 250);
  } else {
    ctx.fillStyle='#f44';
    ctx.strokeText('失败', W/2, 200); ctx.fillText('失败', W/2, 200);
    ctx.font='17px sans-serif'; ctx.fillStyle='#fff';
    ctx.fillText('火力值归零了…再来一局！', W/2, 250);
  }
  ctx.fillStyle='#ffd700';
  ctx.font='18px sans-serif';
  ctx.fillText('本局 +'+state.coinsEarned+'　总币 '+save.coins, W/2, 300);
  drawButton(W/2-110, 360, 220, 56, win?'再来一轮':'再来一次', '#8a2be2', ()=>{
    state.stage=1; state.screen='upgrade';
  });
  drawButton(W/2-110, 440, 220, 48, '返回首页', '#456', ()=>{ state.screen='menu'; });
}

function draw(){
  ctx.save();
  if(state.shake>0){
    ctx.translate(rand(-state.shake,state.shake), rand(-state.shake,state.shake));
  }
  drawMountains();
  drawBridge();

  if(state.screen==='menu') drawMenu();
  else if(state.screen==='upgrade'){ drawWorld(); drawUpgrade(); }
  else if(state.screen==='win'){ drawWorld(); drawEnd(true); }
  else if(state.screen==='lose'){ drawWorld(); drawEnd(false); }
  else { drawWorld(); drawHUD(); }

  if(state.flash>0){
    ctx.fillStyle='rgba(220,180,255,'+(state.flash*0.4)+')';
    ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
}

let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;
  if(state.screen!=='play') state.time+=dt;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.body.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
})();
</script>
</body>
</html>
