<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>丧尸大作战</title>
<meta name="cache-bust" content="v3-gatefire">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a2540;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#061828}
canvas{display:block;max-width:100%;max-height:100%;touch-action:none}
@media(min-width:500px){canvas{border-radius:14px;box-shadow:0 0 50px rgba(0,0,0,.5)}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(function(){
'use strict';

const W=390, H=780;
const SAVE_KEY='zs_gate_v3';
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let dpr=1;

function resize(){
  const vw=window.innerWidth, vh=window.innerHeight;
  const scale=Math.min(vw/W, vh/H);
  const cssW=Math.floor(W*scale), cssH=Math.floor(H*scale);
  dpr=Math.min(window.devicePixelRatio||1, 2.5);
  canvas.width=Math.floor(cssW*dpr);
  canvas.height=Math.floor(cssH*dpr);
  canvas.style.width=cssW+'px';
  canvas.style.height=cssH+'px';
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
}
window.addEventListener('resize',resize);
resize();

// ===== AUDIO =====
let AC=null;
function ensureAudio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state==='suspended') AC.resume();
}
function beep(freq,dur,type,vol,slide){
  if(!AC) return;
  try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.value=freq;
    if(slide) o.frequency.linearRampToValueAtTime(slide, AC.currentTime+dur);
    g.gain.value=vol||0.08;
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
function sfxLaser(){ beep(880+Math.random()*120,0.028,'sawtooth',0.018); }
function sfxHit(){ beep(200,0.04,'sawtooth',0.04,60); }
function sfxGateGood(){ beep(523,0.14,'triangle',0.12,1047); setTimeout(()=>beep(784,0.12,'triangle',0.1),60); }
function sfxGateBad(){ beep(180,0.25,'sawtooth',0.12,60); }
function sfxPop(){ beep(660,0.08,'sine',0.08,1320); }
function sfxBoss(){ beep(90,0.4,'sawtooth',0.14,40); }
function sfxWin(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'triangle',0.1),i*90)); }
function sfxLose(){ beep(260,0.45,'sawtooth',0.1,60); }
function sfxCoin(){ beep(988,0.07,'sine',0.07,1480); }
function sfxUpgrade(){ beep(440,0.12,'triangle',0.1,880); }

// ===== SAVE =====
function loadSave(){
  try{
    const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');
    return {coins:s.coins|0, dmgLv:s.dmgLv|0, rateLv:s.rateLv|0, startLv:s.startLv|0, best:s.best|0};
  }catch(e){ return {coins:0,dmgLv:0,rateLv:0,startLv:0,best:0}; }
}
function saveSave(s){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(s)); }catch(e){} }
let save=loadSave();
function upCost(lv){ return 20 + lv*25 + lv*lv*10; }
function startPower(){ return 5 + save.startLv*4; }
function bulletDmg(){ return 1 + save.dmgLv*0.85; }
function fireInterval(){ return Math.max(0.045, 0.11 - save.rateLv*0.008); }

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function rand(a,b){ return a+Math.random()*(b-a); }
function pick(a){ return a[(Math.random()*a.length)|0]; }
function lerp(a,b,t){ return a+(b-a)*t; }

// ===== PERSPECTIVE =====
const HORIZON_Y=H*0.16;
const ROAD_NEAR_L=22, ROAD_NEAR_R=W-22;
const ROAD_FAR_L=W*0.36, ROAD_FAR_R=W*0.64;
const VIEW_DIST=95; // world units visible ahead
const PLAYER_Z=0; // player plane

function roadEdges(z){
  // z: 0=near(player), 1=horizon
  const t=clamp(z,0,1);
  const ease=Math.pow(t,0.85);
  return {
    l: lerp(ROAD_NEAR_L, ROAD_FAR_L, ease),
    r: lerp(ROAD_NEAR_R, ROAD_FAR_R, ease)
  };
}
function worldToScreen(lane, depthAhead){
  // lane 0..1, depthAhead >=0 (0=player)
  const z=clamp(depthAhead/VIEW_DIST, 0, 1.15);
  const edges=roadEdges(Math.min(z,1));
  const x=lerp(edges.l, edges.r, lane);
  const y=lerp(H-55, HORIZON_Y, Math.pow(Math.min(z,1),0.88));
  const sc=lerp(1.15, 0.12, Math.pow(Math.min(z,1),0.75));
  return {x,y,z,sc, edges};
}

// ===== STATE =====
const S={
  screen:'menu', // menu | play | upgrade | win | lose
  stage:1, maxStage:6,
  lane:0.7,
  power:5,
  displayPower:5,
  scroll:0,
  speed:14,
  shootT:0,
  shake:0,
  flash:0,
  time:0,
  coinsGot:0,
  boss:null,
  bossPhase:false,
  bossIntro:0,
  keys:{l:0,r:0},
  particles:[],
  floats:[],
  lasers:[],
  zombies:[],
  gates:[], // active on road
  crates:[],
  events:[],
  eventI:0,
  stageLen:100,
  popped:false,
  dead:false
};

// ===== INPUT =====
const input={down:false, lastX:0};
function gx(cx){ const r=canvas.getBoundingClientRect(); return (cx-r.left)/r.width; }
function gy(cy){ const r=canvas.getBoundingClientRect(); return (cy-r.top)/r.height; }

canvas.addEventListener('pointerdown',e=>{
  ensureAudio();
  input.down=true; input.lastX=gx(e.clientX);
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  if(S.screen!=='play') handleClick(gx(e.clientX)*W, gy(e.clientY)*H);
});
canvas.addEventListener('pointermove',e=>{
  if(!input.down || S.screen!=='play') return;
  const x=gx(e.clientX);
  S.lane=clamp(S.lane+(x-input.lastX)*1.85, 0.06, 0.94);
  input.lastX=x;
});
canvas.addEventListener('pointerup',()=>{ input.down=false; });
canvas.addEventListener('pointercancel',()=>{ input.down=false; });

window.addEventListener('keydown',e=>{
  ensureAudio();
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') S.keys.l=1;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') S.keys.r=1;
  if(e.key===' '||e.key==='Enter'){
    if(S.screen==='menu') beginRun();
    else if(S.screen==='upgrade') beginStage();
    else if(S.screen==='win'||S.screen==='lose') S.screen='upgrade';
  }
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') S.keys.l=0;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') S.keys.r=0;
});

// ===== STAGE BUILD =====
function gateValue(op, stage, wave){
  if(op==='+') return Math.floor(3+stage*1.2+wave*0.6+rand(0,4));
  if(op==='-') return Math.floor(2+stage+wave*0.5+rand(0,3));
  if(op==='×') return pick([2,2,2,3,3]);
  if(op==='÷') return pick([2,2,3]);
  return 1;
}

function buildStage(){
  const st=S.stage;
  S.stageLen=88+st*16;
  const ev=[];
  let d=14;
  let wave=0;
  while(d < S.stageLen-32){
    wave++;
    // twin gates
    let good=pick(['+','+','+','×']);
    let bad=pick(['-','-','÷']);
    if(wave===1){ good=pick(['+','+','×']); bad='-'; }
    const flip=Math.random()<0.48;
    const L={side:'L', op:flip?bad:good, n:gateValue(flip?bad:good,st,wave), charge:0, need:4, hit:false};
    const R={side:'R', op:flip?good:bad, n:gateValue(flip?good:bad,st,wave), charge:0, need:4, hit:false};
    // × and ÷ don't grow; set high need so they never charge-grow (÷ flips separately)
    if(L.op==='×') L.need=999;
    if(R.op==='×') R.need=999;
    if(L.op==='÷') L.need=8; // shots to crack ÷ into +1
    if(R.op==='÷') R.need=8;
    ev.push({type:'gates', depth:d, L, R});
    d+=9+rand(1.5,3.5);

    // dense zombie pack
    const cols=5+Math.min(3,(st/2)|0);
    const rows=5+Math.min(6,wave+st);
    const hp=1+((st-1)/2)|0;
    ev.push({type:'horde', depth:d, cols, rows, hp, spaced:0.07});
    d+=8+rand(1,3);

    // occasional second denser wave
    if(wave%2===0){
      ev.push({type:'horde', depth:d, cols:6+((st>2)?1:0), rows:6+st, hp:hp+(wave>3?1:0), spaced:0.055});
      d+=7+rand(1,2);
    }
    // crate sometimes
    if(wave%3===0 && Math.random()<0.7){
      ev.push({type:'crate', depth:d, lane:pick([0.25,0.5,0.75]), hp:18+st*6, reward:pick(['power','power','dmg'])});
      d+=5;
    }
  }
  // pre-boss fat gates
  ev.push({
    type:'gates', depth:d,
    L:{side:'L', op:'+', n:8+st*3, charge:0, need:3, hit:false},
    R:{side:'R', op:'×', n:2, charge:0, need:999, hit:false}
  });
  d+=12;
  const bossHP=Math.floor(280+st*220+st*st*90);
  ev.push({type:'boss', depth:d, hp:bossHP});
  S.events=ev;
  S.eventI=0;
}

function beginRun(){
  S.stage=1;
  beginStage();
}
function beginStage(){
  S.screen='play';
  S.lane=0.72;
  S.power=startPower();
  S.displayPower=S.power;
  S.scroll=0;
  S.speed=13+S.stage*0.9;
  S.shootT=0;
  S.shake=0;
  S.flash=0;
  S.coinsGot=0;
  S.boss=null;
  S.bossPhase=false;
  S.bossIntro=0;
  S.particles=[];
  S.floats=[];
  S.lasers=[];
  S.zombies=[];
  S.gates=[];
  S.crates=[];
  S.popped=false;
  S.dead=false;
  buildStage();
  sfxGateGood();
}

function applyGate(g){
  if(g.hit) return;
  g.hit=true;
  const before=S.power;
  let after=before;
  if(g.op==='+') after=before+g.n;
  else if(g.op==='-') after=Math.max(0, before-g.n);
  else if(g.op==='×') after=before*g.n;
  else if(g.op==='÷') after=Math.max(1, Math.floor(before/g.n));
  S.power=Math.min(99999, Math.floor(after));
  const delta=S.power-before;
  const good=delta>=0 && (g.op==='+'||g.op==='×'||(g.op==='-'&&g.n===0));
  // big float
  addFloat(S.lane, 2, (delta>=0?'+':'')+delta, good?'#5dff8a':'#ff5a5a', 1.6);
  addFloat(S.lane, 4, '火力 '+S.power, '#fff', 1.2);
  S.shake=Math.min(18, 6+Math.abs(delta)*0.08);
  S.flash=good?0.25:0.15;
  burst(S.lane, 3, good?22:12, good?'#4dff88':'#ff4444');
  if(good) sfxGateGood(); else sfxGateBad();
  if(Math.abs(delta)>=10) sfxPop();
}

function chargeGate(g, dmg){
  if(g.hit) return;
  if(g.op==='×') return; // multipliers don't grow
  g.charge+=dmg;
  while(g.charge>=g.need){
    g.charge-=g.need;
    if(g.op==='÷'){
      // crack into +1
      g.op='+'; g.n=1; g.need=4; g.charge=0;
      burst(g.side==='L'?0.28:0.72, g.depth-S.scroll, 14, '#4dff88');
      sfxPop();
      break;
    }
    // + and - grow; - can flip to +
    if(g.op==='-'){
      g.n-=1;
      if(g.n<=0){ g.op='+'; g.n=1; }
    } else if(g.op==='+'){
      g.n+=1;
      if(g.n>80+S.stage*10) g.n=80+S.stage*10; // ceiling
    }
  }
}

function addFloat(lane, depthAhead, text, color, life){
  S.floats.push({lane, depth:S.scroll+depthAhead, text, color, life:life||1, max:life||1, vy:-18});
}
function burst(lane, depthAhead, n, color){
  for(let i=0;i<n;i++){
    S.particles.push({
      lane:lane+rand(-0.06,0.06),
      depth:S.scroll+depthAhead,
      vx:rand(-0.35,0.35),
      vz:rand(-8,8),
      life:rand(0.3,0.8),
      max:0.8,
      color:color||'#fff',
      size:rand(2,5)
    });
  }
}

function spawnHorde(ev){
  const {cols, rows, hp, spaced, depth}=ev;
  const startLane=0.5-((cols-1)*spaced)/2;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const jitter=rand(-0.02,0.02);
      S.zombies.push({
        lane:clamp(startLane+c*spaced+jitter,0.08,0.92),
        depth:depth+r*1.15+rand(-0.2,0.2),
        hp:hp,
        maxHp:hp,
        r:rand(0.92,1.08),
        dead:false,
        bob:Math.random()*Math.PI*2
      });
    }
  }
}

function spawnGates(ev){
  const gL=Object.assign({}, ev.L, {depth:ev.depth, hit:false});
  const gR=Object.assign({}, ev.R, {depth:ev.depth, hit:false});
  S.gates.push(gL, gR);
}

function spawnCrate(ev){
  S.crates.push({lane:ev.lane, depth:ev.depth, hp:ev.hp, maxHp:ev.hp, reward:ev.reward, dead:false});
}

function spawnBoss(ev){
  S.boss={
    lane:0.35,
    depth:ev.depth,
    hp:ev.hp,
    maxHp:ev.hp,
    t:0,
    hitFlash:0
  };
  S.bossPhase=true;
  S.bossIntro=1.2;
  S.speed*=0.55;
  sfxBoss();
  S.shake=14;
}

// ===== COMBAT =====
function fireLaser(dt){
  S.shootT-=dt;
  if(S.shootT>0) return;
  S.shootT=fireInterval();
  const dmg=bulletDmg()*(0.85+Math.min(2.5, Math.log10(1+S.power)*0.55));
  // multi-beam based on power
  const beams=1+Math.min(4, (Math.log2(1+S.power/5))|0);
  for(let i=0;i<beams;i++){
    const spread=(i-(beams-1)/2)*0.035;
    S.lasers.push({
      lane:clamp(S.lane+spread,0.04,0.96),
      depth:S.scroll+1.2,
      speed:78,
      dmg:dmg/Math.sqrt(beams),
      life:0.55,
      thick:beams>=3?3.2:2.4
    });
  }
  if(Math.random()<0.4) sfxLaser();
}

function updateLasers(dt){
  for(let i=S.lasers.length-1;i>=0;i--){
    const L=S.lasers[i];
    L.depth+=L.speed*dt;
    L.life-=dt;
    let hit=false;
    const ahead=L.depth-S.scroll;

    // gates first (same lane half)
    for(const g of S.gates){
      if(g.hit) continue;
      const gd=g.depth-S.scroll;
      if(Math.abs(ahead-gd)<1.8){
        const gCenter=g.side==='L'?0.28:0.72;
        if(Math.abs(L.lane-gCenter)<0.24){
          chargeGate(g, L.dmg);
          burst(L.lane, ahead, 3, '#c77dff');
          hit=true; break;
        }
      }
    }
    if(hit){ S.lasers.splice(i,1); continue; }

    // crates
    for(const c of S.crates){
      if(c.dead) continue;
      const cd=c.depth-S.scroll;
      if(Math.abs(ahead-cd)<1.6 && Math.abs(L.lane-c.lane)<0.12){
        c.hp-=L.dmg;
        burst(L.lane, ahead, 4, '#ffd24a');
        if(c.hp<=0){
          c.dead=true;
          if(c.reward==='power'){ S.power+=8+S.stage*2; addFloat(c.lane, ahead, '+火力', '#5dff8a', 1.2); }
          else { S.power+=5; addFloat(c.lane, ahead, '强化!', '#ffd24a', 1.2); }
          S.coinsGot+=5; sfxCoin(); burst(c.lane, ahead, 20, '#ffd24a');
        }
        hit=true; break;
      }
    }
    if(hit){ S.lasers.splice(i,1); continue; }

    // zombies — pierce up to 3 like laser
    let pierced=0;
    for(const z of S.zombies){
      if(z.dead) continue;
      const zd=z.depth-S.scroll;
      if(Math.abs(ahead-zd)<1.4 && Math.abs(L.lane-z.lane)<0.09*z.r){
        z.hp-=L.dmg;
        pierced++;
        if(z.hp<=0){
          z.dead=true;
          S.coinsGot+=1;
          burst(z.lane, zd, 6, '#6dff6d');
          if(Math.random()<0.08) sfxHit();
        }
        if(pierced>=3) break;
      }
    }
    if(pierced){ S.lasers.splice(i,1); continue; }

    // boss
    if(S.boss && !S.dead){
      const bd=S.boss.depth-S.scroll;
      if(ahead>bd-2 && ahead<bd+6 && Math.abs(L.lane-S.boss.lane)<0.28){
        S.boss.hp-=L.dmg*1.15;
        S.boss.hitFlash=0.12;
        burst(L.lane, ahead, 5, '#fff59a');
        if(S.boss.hp<=0){
          S.boss.hp=0;
          winStage();
        }
        S.lasers.splice(i,1); continue;
      }
    }

    if(L.life<=0 || ahead>VIEW_DIST) S.lasers.splice(i,1);
  }
}

function winStage(){
  if(S.popped) return;
  S.popped=true;
  S.coinsGot+=30+S.stage*20;
  save.coins+=S.coinsGot;
  if(S.stage>save.best) save.best=S.stage;
  saveSave(save);
  burst(0.5, 20, 40, '#ffd700');
  S.shake=16; S.flash=0.4;
  sfxWin();
  setTimeout(()=>{
    if(S.stage>=S.maxStage) S.screen='win';
    else { S.stage++; S.screen='upgrade'; }
  }, 700);
}

function loseRun(){
  if(S.dead) return;
  S.dead=true;
  save.coins+=S.coinsGot;
  saveSave(save);
  sfxLose();
  S.shake=12;
  setTimeout(()=>{ S.screen='lose'; }, 500);
}

// ===== UPDATE =====
function update(dt){
  S.time+=dt;
  if(S.shake>0) S.shake=Math.max(0,S.shake-dt*28);
  if(S.flash>0) S.flash=Math.max(0,S.flash-dt);
  // smooth display power
  S.displayPower += (S.power-S.displayPower)*Math.min(1,dt*10);

  if(S.screen!=='play' || S.popped || S.dead) {
    updateFX(dt);
    return;
  }

  // steer keys
  if(S.keys.l) S.lane=clamp(S.lane-1.5*dt,0.06,0.94);
  if(S.keys.r) S.lane=clamp(S.lane+1.5*dt,0.06,0.94);

  // scroll / auto-run
  let spd=S.speed;
  if(S.bossIntro>0){ S.bossIntro-=dt; spd*=0.3; }
  // slow slightly near dense zombies ahead
  S.scroll+=spd*dt;

  // spawn events when approaching
  while(S.eventI<S.events.length){
    const ev=S.events[S.eventI];
    if(ev.depth-S.scroll > VIEW_DIST*0.95) break;
    if(ev.type==='gates') spawnGates(ev);
    else if(ev.type==='horde') spawnHorde(ev);
    else if(ev.type==='crate') spawnCrate(ev);
    else if(ev.type==='boss') spawnBoss(ev);
    S.eventI++;
  }

  // fire
  fireLaser(dt);
  updateLasers(dt);

  // gate pass-through
  for(const g of S.gates){
    if(g.hit) continue;
    const ahead=g.depth-S.scroll;
    if(ahead<1.5 && ahead>-0.5){
      const gCenter=g.side==='L'?0.28:0.72;
      // half-road: if player on that half, take the gate
      const onLeft=S.lane<0.5;
      if((g.side==='L'&&onLeft)||(g.side==='R'&&!onLeft)){
        applyGate(g);
      }
    }
    if(ahead<-4) g.hit=true; // miss
  }

  // zombies march toward player
  for(let i=S.zombies.length-1;i>=0;i--){
    const z=S.zombies[i];
    if(z.dead){ if((z.depth-S.scroll)<-5) S.zombies.splice(i,1); continue; }
    z.depth-=(3.2+S.stage*0.35)*dt; // walk toward player (decrease depth)
    z.bob+=dt*6;
    const ahead=z.depth-S.scroll;
    if(ahead<2.2 && ahead>-0.5){
      // contact: drain 1 power per zombie
      S.power=Math.max(0, S.power-1);
      z.dead=true;
      burst(z.lane, Math.max(0.5,ahead), 5, '#ff5555');
      S.shake=Math.min(14, S.shake+2);
      if(S.power<=0){ loseRun(); break; }
    }
    if(ahead<-8) S.zombies.splice(i,1);
  }

  // crates pass
  for(const c of S.crates){
    if(c.dead) continue;
    const ahead=c.depth-S.scroll;
    if(ahead<1.8 && ahead>-0.3 && Math.abs(S.lane-c.lane)<0.1){
      // bump cost
      S.power=Math.max(0,S.power-3);
      c.dead=true;
      burst(c.lane, ahead, 10, '#ff8844');
      if(S.power<=0) loseRun();
    }
  }

  // boss contact damage over time if too close without killing
  if(S.boss && S.boss.hp>0){
    S.boss.t+=dt;
    if(S.boss.hitFlash>0) S.boss.hitFlash-=dt;
    const ahead=S.boss.depth-S.scroll;
    // keep boss roughly in view
    if(ahead<18) S.boss.depth=S.scroll+18;
    if(ahead<10){
      // pressure
      if((S.boss.t*2|0)%2===0 && Math.random()<0.02){
        S.power=Math.max(0,S.power-1);
        if(S.power<=0) loseRun();
      }
    }
  }

  updateFX(dt);

  // cleanup far gates
  S.gates=S.gates.filter(g=>(g.depth-S.scroll)>-6);
  S.crates=S.crates.filter(c=>!c.dead && (c.depth-S.scroll)>-6);
}

function updateFX(dt){
  for(let i=S.particles.length-1;i>=0;i--){
    const p=S.particles[i];
    p.life-=dt;
    p.lane+=p.vx*dt;
    p.depth+=p.vz*dt;
    if(p.life<=0) S.particles.splice(i,1);
  }
  for(let i=S.floats.length-1;i>=0;i--){
    const f=S.floats[i];
    f.life-=dt;
    f.depth+=f.vy*dt*0.05;
    if(f.life<=0) S.floats.splice(i,1);
  }
}

// ===== DRAW =====

  ctx.beginPath();
  ctx.moveTo(0,HORIZON_Y+40);
  ctx.lineTo(40,HORIZON_Y-10);
  ctx.lineTo(90,HORIZON_Y+25);
  ctx.lineTo(140,HORIZON_Y-30);
  ctx.lineTo(200,HORIZON_Y+15);
  ctx.lineTo(260,HORIZON_Y-20);
  ctx.lineTo(320,HORIZON_Y+20);
  ctx.lineTo(370,HORIZON_Y-5);
  ctx.lineTo(W,HORIZON_Y+35);
  ctx.lineTo(W,HORIZON_Y+90);
  ctx.lineTo(0,HORIZON_Y+90);
  ctx.fill();
  ctx.fillStyle='#2d553f';
  ctx.beginPath();
  ctx.moveTo(0,HORIZON_Y+55);
  ctx.lineTo(60,HORIZON_Y+15);
  ctx.lineTo(110,HORIZON_Y+45);
  ctx.lineTo(180,HORIZON_Y+5);
  ctx.lineTo(250,HORIZON_Y+40);
  ctx.lineTo(310,HORIZON_Y+10);
  ctx.lineTo(W,HORIZON_Y+50);

  // distant sea/haze
  ctx.fillStyle='rgba(100,160,200,0.35)';
  ctx.fillRect(0,HORIZON_Y+70,W,40);
}

function drawRoad(){
  // perspective road polygon
  const near=roadEdges(0), far=roadEdges(1);
  ctx.beginPath();
  ctx.moveTo(near.l, H-40);
  ctx.lineTo(far.l, HORIZON_Y+8);
  ctx.lineTo(far.r, HORIZON_Y+8);
  ctx.lineTo(near.r, H-40);
  ctx.closePath();
  const rg=ctx.createLinearGradient(0,HORIZON_Y,0,H);
  rg.addColorStop(0,'#6a6e74');
  rg.addColorStop(1,'#4a4e54');
  ctx.fillStyle=rg;
  ctx.fill();

  // barriers
  ctx.strokeStyle='#9aa0a8';
  ctx.lineWidth=6;
  ctx.beginPath();
  ctx.moveTo(near.l-4,H-40); ctx.lineTo(far.l-2,HORIZON_Y+8); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(near.r+4,H-40); ctx.lineTo(far.r+2,HORIZON_Y+8); ctx.stroke();
  ctx.strokeStyle='#c8ccd2';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(near.l-8,H-40); ctx.lineTo(far.l-4,HORIZON_Y+8); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(near.r+8,H-40); ctx.lineTo(far.r+4,HORIZON_Y+8); ctx.stroke();

  // lane dashes scrolling
  const dashPeriod=6;
  const off=(S.scroll%dashPeriod);
  for(let i=-1;i<20;i++){
    const d=i*dashPeriod-off+2;
    if(d<0||d>VIEW_DIST) continue;
    const a=worldToScreen(0.5, d);
    const b=worldToScreen(0.5, d+2.2);
    if(a.z>1||b.z>1) continue;
    ctx.strokeStyle='rgba(255,220,60,0.75)';
    ctx.lineWidth=Math.max(1.5,3*a.sc);
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.stroke();
  }

  // checkered near start
  if(S.scroll<25){
    const d=8-S.scroll;
    if(d>0 && d<VIEW_DIST){
      for(let k=0;k<8;k++){
        const la=k/8, lb=(k+1)/8;
        const p1=worldToScreen(la,d), p2=worldToScreen(lb,d);
        const p3=worldToScreen(lb,d+1.5), p4=worldToScreen(la,d+1.5);
        ctx.fillStyle=(k%2===0)?'#222':'#eee';
        ctx.beginPath();
        ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.lineTo(p3.x,p3.y); ctx.lineTo(p4.x,p4.y);
        ctx.fill();
      }
    }
  }
}

function drawGate(g){
  const ahead=g.depth-S.scroll;
  if(ahead<-3||ahead>VIEW_DIST) return;
  const center=g.side==='L'?0.28:0.72;
  const left=g.side==='L'?0.04:0.52;
  const right=g.side==='L'?0.48:0.96;
  const pL=worldToScreen(left, ahead);
  const pR=worldToScreen(right, ahead);
  const pL2=worldToScreen(left, ahead+1.2);
  const pR2=worldToScreen(right, ahead+1.2);
  const h=Math.max(18, 70*pL.sc);

  const isBlue=g.op==='+'||g.op==='×';
  const col=isBlue?'rgba(90,70,220,0.72)':'rgba(210,40,50,0.72)';
  const edge=isBlue?'#a090ff':'#ff6a6a';

  ctx.save();
  // panel
  ctx.beginPath();
  ctx.moveTo(pL.x, pL.y-h);
  ctx.lineTo(pR.x, pR.y-h);
  ctx.lineTo(pR2.x, pR2.y-h*0.85);
  ctx.lineTo(pL2.x, pL2.y-h*0.85);
  ctx.closePath();
  ctx.fillStyle=col;
  ctx.fill();
  ctx.strokeStyle=edge;
  ctx.lineWidth=Math.max(2,3*pL.sc);
  ctx.stroke();

  // posts
  ctx.fillStyle='#ddd';
  ctx.fillRect(pL.x-3*pL.sc, pL.y-h, 5*pL.sc, h+8*pL.sc);
  ctx.fillRect(pR.x-3*pR.sc, pR.y-h, 5*pR.sc, h+8*pR.sc);

  // label
  const opChar=g.op==='×'?'×':g.op==='÷'?'÷':g.op;
  const label=opChar+g.n;
  const cx=(pL.x+pR.x)/2;
  const cy=pL.y-h*0.55;
  ctx.font='bold '+Math.max(14, Math.floor(34*pL.sc))+'px sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.strokeStyle='rgba(0,0,0,0.45)';
  ctx.lineWidth=4;
  ctx.strokeText(label, cx, cy);
  ctx.fillStyle='#fff';
  ctx.fillText(label, cx, cy);

  // charge bar for growable
  if(!g.hit && g.op!=='×' && g.need<100){
    const pct=clamp(g.charge/g.need,0,1);
    const bw=Math.abs(pR.x-pL.x)*0.7;
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.fillRect(cx-bw/2, cy+h*0.28, bw, 5*pL.sc);
    ctx.fillStyle='#ffe566';
    ctx.fillRect(cx-bw/2, cy+h*0.28, bw*pct, 5*pL.sc);
  }
  ctx.restore();
}

function drawZombie(z){
  const ahead=z.depth-S.scroll;
  if(ahead<-2||ahead>VIEW_DIST) return;
  const p=worldToScreen(z.lane, ahead);
  const r=Math.max(3, 14*p.sc*z.r);
  const bob=Math.sin(z.bob)*2*p.sc;
  ctx.save();
  // body circle
  ctx.beginPath();
  ctx.arc(p.x, p.y-r+bob, r, 0, Math.PI*2);
  ctx.fillStyle=z.dead?'#3a5a3a':'#3dcc4a';
  ctx.fill();
  ctx.strokeStyle='#1a7a28';
  ctx.lineWidth=Math.max(1,2*p.sc);
  ctx.stroke();
  if(!z.dead){
    // simple face
    ctx.fillStyle='#1a3a1a';
    ctx.beginPath(); ctx.arc(p.x-r*0.28, p.y-r*0.2+bob, r*0.15,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(p.x+r*0.28, p.y-r*0.2+bob, r*0.15,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#1a3a1a';
    ctx.lineWidth=1.2*p.sc;
    ctx.beginPath();
    ctx.arc(p.x, p.y+r*0.15+bob, r*0.28, 0.1*Math.PI, 0.9*Math.PI);
    ctx.stroke();
  }
  ctx.restore();
}

function drawBoss(){
  if(!S.boss) return;
  const b=S.boss;
  const ahead=b.depth-S.scroll;
  const p=worldToScreen(b.lane, ahead);
  const sc=p.sc*1.6;
  const flash=b.hitFlash>0;

  ctx.save();
  // platform
  ctx.fillStyle='rgba(40,40,50,0.7)';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y+8*sc, 38*sc, 10*sc, 0, 0, Math.PI*2);
  ctx.fill();

  // giant gold soldier body
  const bodyH=110*sc;
  const grd=ctx.createLinearGradient(p.x, p.y-bodyH, p.x, p.y);
  grd.addColorStop(0, flash?'#fff2a0':'#ffe566');
  grd.addColorStop(0.5, flash?'#ffd700':'#e8b800');
  grd.addColorStop(1, '#b8860b');
  // legs
  ctx.fillStyle=grd;
  ctx.fillRect(p.x-18*sc, p.y-35*sc, 12*sc, 38*sc);
  ctx.fillRect(p.x+6*sc, p.y-35*sc, 12*sc, 38*sc);
  // torso
  ctx.beginPath();
  ctx.roundRect(p.x-26*sc, p.y-95*sc, 52*sc, 62*sc, 8*sc);
  ctx.fill();
  // head
  ctx.beginPath();
  ctx.arc(p.x, p.y-108*sc, 16*sc, 0, Math.PI*2);
  ctx.fill();
  // helmet visor
  ctx.fillStyle='#222';
  ctx.fillRect(p.x-10*sc, p.y-112*sc, 20*sc, 8*sc);
  // rifle
  ctx.fillStyle='#555';
  ctx.fillRect(p.x+20*sc, p.y-80*sc, 40*sc, 7*sc);
  ctx.fillStyle='#333';
  ctx.fillRect(p.x+55*sc, p.y-82*sc, 12*sc, 11*sc);
  // armor glow
  ctx.strokeStyle='rgba(255,255,200,0.6)';
  ctx.lineWidth=2*sc;
  ctx.strokeRect(p.x-22*sc, p.y-90*sc, 44*sc, 20*sc);

  // HUGE HP number
  const hpText=String(Math.max(0, Math.ceil(b.hp)));
  ctx.font='bold '+Math.max(22, Math.floor(48*sc))+'px sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.lineWidth=6*sc;
  ctx.strokeStyle='rgba(0,0,0,0.65)';
  ctx.strokeText(hpText, p.x, p.y-125*sc);
  ctx.fillStyle='#ffffff';
  ctx.fillText(hpText, p.x, p.y-125*sc);

  // hp bar
  const bw=70*sc, bh=7*sc;
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.fillRect(p.x-bw/2, p.y-145*sc, bw, bh);
  ctx.fillStyle='#ff4444';
  ctx.fillRect(p.x-bw/2, p.y-145*sc, bw*clamp(b.hp/b.maxHp,0,1), bh);
  ctx.restore();
}

function drawTank(){
  const p=worldToScreen(S.lane, 0.8);

  const x=p.x, y=H-78;

  ctx.save();
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x, y+22, 36, 10, 0, 0, Math.PI*2); ctx.fill();

  // wheels
  ctx.fillStyle='#1a2a4a';
  [[-22,14],[-8,16],[8,16],[22,14]].forEach(([dx,dy])=>{
    ctx.beginPath(); ctx.ellipse(x+dx*sc, y+dy*sc, 9*sc, 7*sc, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle='#4af';
    ctx.lineWidth=1.5;
    ctx.stroke();
  });

  // body
  const bg=ctx.createLinearGradient(x-30,y-20,x+30,y+10);
  bg.addColorStop(0,'#5ec8ff');
  bg.addColorStop(0.5,'#2a8dff');
  bg.addColorStop(1,'#1a5fbb');
  ctx.fillStyle=bg;
  ctx.beginPath();
  ctx.roundRect(x-28*sc, y-18*sc, 56*sc, 28*sc, 8*sc);
  ctx.fill();
  ctx.strokeStyle='#9ae0ff';
  ctx.lineWidth=2;
  ctx.stroke();

  // turret
  ctx.fillStyle='#3aa0ff';
  ctx.beginPath();
  ctx.roundRect(x-14*sc, y-32*sc, 28*sc, 18*sc, 6*sc);
  ctx.fill();
  // cannon
  ctx.fillStyle='#7ec8ff';
  ctx.fillRect(x-4*sc, y-48*sc, 8*sc, 20*sc);

  // power number on tank
  const pw=Math.round(S.displayPower);
  ctx.font='bold 22px sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.lineWidth=4;
  ctx.strokeStyle='rgba(0,0,0,0.55)';
  ctx.strokeText(String(pw), x, y-4*sc);
  ctx.fillStyle='#fff';
  ctx.fillText(String(pw), x, y-4*sc);

  // glow ring
  ctx.strokeStyle='rgba(100,200,255,0.45)';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(x, y+4, 32*sc, 12*sc, 0, 0, Math.PI*2); ctx.stroke();

function drawLasers(){
  for(const L of S.lasers){
    const ahead=L.depth-S.scroll;
    if(ahead<0||ahead>VIEW_DIST) continue;
    const from=worldToScreen(L.lane, Math.max(0.5, ahead-6));
    const to=worldToScreen(L.lane, ahead);
    const grd=ctx.createLinearGradient(from.x, from.y, to.x, to.y);
    grd.addColorStop(0,'rgba(180,80,255,0)');
    grd.addColorStop(0.3,'rgba(200,100,255,0.85)');
    grd.addColorStop(1,'rgba(255,180,255,1)');
    ctx.strokeStyle=grd;
    ctx.lineWidth=L.thick*Math.max(0.6, to.sc*2);
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(from.x, from.y-20);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
    // core
    ctx.strokeStyle='rgba(255,230,255,0.9)';
    ctx.lineWidth=L.thick*0.4;
    ctx.beginPath();
    ctx.moveTo(from.x, from.y-20);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
    // impact spark
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(to.x, to.y, 3*to.sc+2, 0, Math.PI*2); ctx.fill();
  }
}

function drawParticles(){
  for(const p of S.particles){
    const ahead=p.depth-S.scroll;
    if(ahead<-2||ahead>VIEW_DIST) continue;
    const s=worldToScreen(p.lane, Math.max(0,ahead));
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, p.size*s.sc, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }
}

function drawFloats(){
  for(const f of S.floats){
    const ahead=Math.max(0, f.depth-S.scroll);
    const s=worldToScreen(f.lane, ahead);
    const a=clamp(f.life/f.max,0,1);
    ctx.save();
    ctx.globalAlpha=a;
    ctx.font='bold '+Math.max(16, Math.floor(28*s.sc*(0.8+a*0.4)))+'px sans-serif';
    ctx.textAlign='center';
    ctx.lineWidth=4;
    ctx.strokeStyle='rgba(0,0,0,0.5)';
    ctx.strokeText(f.text, s.x, s.y-40*s.sc);
    ctx.fillStyle=f.color;
    ctx.fillText(f.text, s.x, s.y-40*s.sc);
    ctx.restore();
  }
}

function drawHUD(){
  // top bar
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.fillRect(0,0,W,48);
  ctx.font='bold 16px sans-serif';
  ctx.textAlign='left';
  ctx.fillStyle='#ffd24a';
  ctx.fillText('金币 '+save.coins, 14, 30);
  ctx.textAlign='center';
  ctx.fillStyle='#fff';
  ctx.fillText('第 '+S.stage+' 关', W/2, 30);
  ctx.textAlign='right';
  ctx.fillStyle='#a8e0ff';
  ctx.fillText('火力 '+Math.round(S.displayPower), W-14, 30);

function drawCrate(c){
  const ahead=c.depth-S.scroll;
  if(ahead<-2||ahead>VIEW_DIST) return;
  const p=worldToScreen(c.lane, ahead);
  const s=22*p.sc;
  ctx.fillStyle='#8B4513';
  ctx.fillRect(p.x-s, p.y-s*1.4, s*2, s*1.6);
  ctx.strokeStyle='#ffd24a';
  ctx.lineWidth=2;
  ctx.strokeRect(p.x-s, p.y-s*1.4, s*2, s*1.6);
  ctx.fillStyle='#ffd24a';
  ctx.font='bold '+Math.max(10,14*p.sc)+'px sans-serif';
  ctx.textAlign='center';
  ctx.fillText(Math.ceil(c.hp), p.x, p.y-s*0.5);
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// polyfill roundRect on ctx if needed - we used ctx.roundRect in tank/boss
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='number') r={tl:r,tr:r,br:r,bl:r};
    this.moveTo(x+r.tl,y);
    this.lineTo(x+w-r.tr,y); this.quadraticCurveTo(x+w,y,x+w,y+r.tr);
    this.lineTo(x+w,y+h-r.br); this.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h);
    this.lineTo(x+r.bl,y+h); this.quadraticCurveTo(x,y+h,x,y+h-r.bl);
    this.lineTo(x,y+r.tl); this.quadraticCurveTo(x,y,x+r.tl,y);
    this.closePath(); return this;
  };
}

function drawPlay(){
  ctx.save();
  if(S.shake>0){
    ctx.translate(rand(-S.shake,S.shake), rand(-S.shake,S.shake));
  }
  drawBackground();
  drawRoad();

  // depth-sort drawables
  const items=[];
  for(const g of S.gates) items.push({d:g.depth, draw:()=>drawGate(g)});
  for(const c of S.crates) if(!c.dead) items.push({d:c.depth, draw:()=>drawCrate(c)});
  for(const z of S.zombies) items.push({d:z.depth, draw:()=>drawZombie(z)});
  if(S.boss) items.push({d:S.boss.depth, draw:drawBoss});
  items.sort((a,b)=>b.d-a.d);
  for(const it of items) it.draw();

  drawLasers();
  drawParticles();
  drawFloats();
  drawTank();
  ctx.restore();

  if(S.flash>0){
    ctx.fillStyle=S.flash>0.15?'rgba(100,255,150,0.2)':'rgba(255,255,255,0.12)';
    ctx.fillRect(0,0,W,H);
  }
  drawHUD();

  // hint first seconds
  if(S.scroll<12){
    ctx.font='15px sans-serif';
    ctx.textAlign='center';
    ctx.fillStyle='rgba(255,255,255,0.8)';
    ctx.fillText('左右滑动选门 · 自动开火', W/2, H-28);
  }
}

function btn(x,y,w,h,label,color){
  roundRect(x,y,w,h,14);
  ctx.fillStyle=color||'#2a8dff';
  ctx.fill();
  ctx.fillStyle='#fff';
  ctx.font='bold 18px sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(label, x+w/2, y+h/2);
  return {x,y,w,h,label};
}

let uiHit=[];
function handleClick(x,y){
  for(const b of uiHit){
    if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
      if(b.action) b.action();
      return;
    }
  }
}

function drawMenu(){
  drawBackground();
  drawRoad();
  // decorative tank
  S.lane=0.7;
  drawTank();
  // fake horde silhouette
  for(let i=0;i<30;i++){
    const z={lane:0.2+(i%6)*0.1, depth:S.scroll+25+(i/6)*2, hp:1,maxHp:1,r:1,dead:false,bob:i};
    drawZombie(z);
  }

  ctx.fillStyle='rgba(0,10,30,0.55)';
  ctx.fillRect(0,0,W,H);

  ctx.textAlign='center';
  ctx.font='bold 42px sans-serif';
  ctx.fillStyle='#fff';
  ctx.fillText('丧尸大作战', W/2, 160);
  ctx.font='16px sans-serif';
  ctx.fillStyle='#a8d8ff';
  ctx.fillText('冲门暴涨 · 紫光坦克 · 歼灭尸潮', W/2, 200);

  uiHit=[];
  const b=btn(W/2-90, 380, 180, 56, '开始游戏', '#5b4bff');
  b.action=()=>beginRun();
  uiHit.push(b);

  ctx.font='13px sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.fillText('拖动或 A/D 转向 · 射击全自动', W/2, 470);
  ctx.fillText('金币 '+save.coins+' · 最高第 '+Math.max(1,save.best)+' 关', W/2, 495);
}

function drawUpgrade(){
  drawBackground();
  ctx.fillStyle='rgba(0,10,30,0.7)';
  ctx.fillRect(0,0,W,H);

  ctx.textAlign='center';
  ctx.font='bold 28px sans-serif';
  ctx.fillStyle='#fff';
  ctx.fillText('升级火力', W/2, 100);
  ctx.font='15px sans-serif';
  ctx.fillStyle='#ffd24a';
  ctx.fillText('金币 '+save.coins, W/2, 130);
  ctx.fillStyle='#a8d8ff';
  ctx.fillText('即将进入第 '+S.stage+' 关', W/2, 155);

  uiHit=[];
  const rows=[
    {name:'初始火力', lv:save.startLv, key:'startLv', desc:'开局人数/火力'},
    {name:'激光伤害', lv:save.dmgLv, key:'dmgLv', desc:'每发伤害'},
    {name:'射速', lv:save.rateLv, key:'rateLv', desc:'射击更快'}
  ];
  rows.forEach((r,i)=>{
    const y=200+i*85;
    ctx.fillStyle='rgba(255,255,255,0.08)';
    roundRect(30,y,W-60,72,12); ctx.fill();
    ctx.textAlign='left';
    ctx.font='bold 17px sans-serif';
    ctx.fillStyle='#fff';
    ctx.fillText(r.name+'  Lv.'+r.lv, 48, y+28);
    ctx.font='13px sans-serif';
    ctx.fillStyle='#99aabb';
    ctx.fillText(r.desc, 48, y+50);
    const cost=upCost(r.lv);
    const can=save.coins>=cost;
    const b={x:W-130,y:y+16,w:80,h:40,label:cost+'币'};
    roundRect(b.x,b.y,b.w,b.h,10);
    ctx.fillStyle=can?'#2a8dff':'#445';
    ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='bold 14px sans-serif';
    ctx.textAlign='center';
    ctx.fillText(b.label, b.x+b.w/2, b.y+b.h/2+1);
    b.action=()=>{
      if(save.coins<cost) return;
      save.coins-=cost; save[r.key]++; saveSave(save); sfxUpgrade();
    };
    uiHit.push(b);
  });

  const go=btn(W/2-90, 490, 180, 54, '继续冲关', '#5b4bff');
  go.action=()=>beginStage();
  uiHit.push(go);
}

function drawEnd(win){
  drawBackground();
  ctx.fillStyle='rgba(0,10,30,0.72)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='bold 36px sans-serif';
  ctx.fillStyle=win?'#ffd700':'#ff6a6a';
  ctx.fillText(win?'全部通关！':'火力归零', W/2, 220);
  ctx.font='16px sans-serif';
  ctx.fillStyle='#fff';
  ctx.fillText(win?'你碾压了所有丧尸Boss':'再冲一次，选对门就能暴涨', W/2, 270);
  ctx.fillStyle='#ffd24a';
  ctx.fillText('金币 '+save.coins, W/2, 310);

  uiHit=[];
  const b=btn(W/2-90, 400, 180, 54, win?'再来一局':'重新开始', '#5b4bff');
  b.action=()=>{ if(win){ S.stage=1; } S.screen='upgrade'; };
  uiHit.push(b);
  const m=btn(W/2-90, 470, 180, 48, '回主菜单', '#334');
  m.action=()=>{ S.screen='menu'; };
  uiHit.push(m);
}

function render(){
  ctx.clearRect(0,0,W,H);
  uiHit=[];
  if(S.screen==='menu') drawMenu();
  else if(S.screen==='play') drawPlay();
  else if(S.screen==='upgrade') drawUpgrade();
  else if(S.screen==='win') drawEnd(true);
  else if(S.screen==='lose') drawEnd(false);
}

// ===== LOOP =====
let last=performance.now();
function frame(now){
  let dt=Math.min(0.05, (now-last)/1000);
  last=now;
  // fixed-ish multi-step for stability
  const steps=dt>0.03?2:1;
  const sdt=dt/steps;
  for(let i=0;i<steps;i++) update(sdt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
